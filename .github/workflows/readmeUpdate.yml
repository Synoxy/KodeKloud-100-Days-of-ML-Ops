name: Detect Newly Added README Files and Update README.md
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  detect-files:
    runs-on: ubuntu-latest
    steps:
    #1 Checkout repository with full history so that git diff can detect newly added files.
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
    #2 Detect newly added README files
      - name: Detect file and Permalinks
        run: | 
          echo "Checking push events"
          FILES=$(git diff --name-only --diff-filter=A ${{ github.event.before }} ${{ github.event.after }})
          README_UPDATED=false
          if [ -z "$FILES" ]; then
            echo "No newly added files found in this push."
            exit 0
          else
            echo "🚀 NEWLY ADDED FILES DETECTED:"
            echo "$FILES"
            echo "$FILES" | while read -r file; do
              # URL-encode spaces to %20 for a valid clickable link
              if [[ "$file" =~ ^Day\ [0-9]+.*\.md$ ]]; then
                DAY_NUM=$(echo "$file" | grep -oE 'Day [0-9]+' | awk '{print $2}')
                ENCODED_FILE=$(echo "$file" | sed 's/ /%20/g')
                PERMALINK="https://github.com/${{ github.repository }}/blob/${{ github.sha }}/$ENCODED_FILE"
                NEW_LINK="- [$file]($PERMALINK)"
                echo "$NEW_LINK"
                sed -i "s/📈 Progress: Day [0-9]* \/ 100 Completed/📈 Progress: Day $DAY_NUM \/ 100 Completed/g" README.md
                sed -i "\|🚧 More days coming soon...|i $NEW_LINK" README.md
                README_UPDATED=true
                echo "✅ README.md updated with new file: $file"
              fi
            done
            echo "README_UPDATED=$README_UPDATED" >> $GITHUB_ENV
          fi
      - name: Commit and Push changes
        if: env.README_UPDATED == 'true'
        run: |
          echo "Committing and pushing changes to README.md"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add README.md
          git commit -m "chore: auto-update README progress tracking [skip ci]"
          git push origin master
          echo "✅ Changes pushed to README.md"
